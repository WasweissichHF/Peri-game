        #info {

        }

        #fortschritt {

            margin: 10px auto;
            overflow: hidden;
        }

        #balken {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width .3s;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 4px;
            max-width: 700px;
            margin: 12px auto;
        }

        .el {
            aspect-ratio: 1 / 1;
            border-radius: 6px;

            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 800;
            border: 1px solid rgba(0, 0, 0, .1);

        .leer {
            background: transparent;
            border: none;

        }

        .erdalkali { background: #ffcf7a; }
        .uebergang { background: #ffe27a; }
        .metall { background: #a8d8a8; }
        .halbmetall { background: #7fcdbb; }
        .nichtmetall { background: #7ec8e3; }

        .lanth { background: #f4a9c4; }

            try {

                let json = await r.json();
                return json.scores || [];
            } catch (e) {
                let r2 = await fetch(LEADERBOARD_URL);
                let json2 = await r2.json();
                return json2.scores || [];
            }

        async function ladeRangliste() {

            const box = document.getElementById('ranglisteInhalt');

            try {

                let daten = await holeDaten();
                daten.sort((a, b) => b.punkte - a.punkte);
                let top = daten.slice(0, 10);

                if (top.length === 0) {
                    box.innerHTML = t('keineEintraege');
                    return;

        // ================= SPIEL LOGIK =================

        let queue = [];
        let index = 0;
        let ziel = null;
        let geloest = false;
        let punkte = 0;
        let fehler = 0;
        let falschListe = [];
        let phase = "haupt";
        let rekord = leseRekord();

        function mischen(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function neustart() {
            document.getElementById('ende').style.display = 'none';
            document.getElementById('grid').style.display = 'grid';
            document.getElementById('weiterBtn').style.display = 'block';
            queue = mischen(E);
            index = 0;
            punkte = 0;
            fehler = 0;
            falschListe = [];
            phase = "haupt";
            neueFrage();
        }

        function neueFrage() {

            geloest = false;
            document.getElementById('meldung').textContent = '';

            if (index >= queue.length) {

                if (falschListe.length > 0) {
                    phase = "wiederholung";
                    queue = mischen(falschListe);
                    falschListe = [];
                    index = 0;
                    document.getElementById('meldung').textContent = t('wiederholungMsg');
                } else {
                    spielEnde();
                    return;
                }

            }

            ziel = queue[index];

            let phasenText = phase === "wiederholung" ? t('wiederholung') : t('haupt');

            document.getElementById('frage').textContent = t('woIst') + elementName(ziel) + t('frageZeichen');

            updateInfo(phasenText);
            bauen();

        }

        function updateInfo(phasenText) {

            if (!ziel) return;

            let pct = phase === "haupt" ? Math.round((index / 118) * 100) : 100;

            document.getElementById('balken').style.width = pct + '%';

            document.getElementById('info').innerHTML =
                t('hallo') + username + ' | ' + phasenText + ' | ' + t('frageVon') + ' ' + (index + 1) + ' ' + t('von') + ' ' + queue.length + '<br>' +
                t('punkte') + ': ' + punkte + ' | ' + t('fehler') + ': ' + fehler + ' | ' + t('zumWiederholen') + ': ' + falschListe.length + '<br>' +
                t('deinRekord') + ': ' + rekord + ' ' + t('punkte');

        }

        function bauen() {

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for (let r = 1; r <= 9; r++) {

                for (let c = 1; c <= 18; c++) {

                    const el = E.find(e => e[3] === r && e[4] === c);
                    const d = document.createElement('div');

                    if (!el) {
                        d.className = 'el leer';
                        grid.appendChild(d);
                        continue;
                    }

                    d.className = 'el ' + el[5];
                    d.textContent = el[0];
                    d.onclick = () => klick(el, d);
                    grid.appendChild(d);

                }

            }

        }

        function klick(el, div) {

            if (geloest) return;

            if (el[0] === ziel[0]) {
                div.classList.add('richtig');
                document.getElementById('meldung').textContent = t('richtig') + elementName(ziel) + t('ist') + ziel[0] + ' (' + ziel[1] + ')';
                punkte += 10;
                geloest = true;
            } else {
                div.classList.add('falsch');
                document.getElementById('meldung').textContent = t('falsch') + elementName(el) + t('klickRichtig');
                fehler++;
                if (!falschListe.find(x => x[0] === ziel[0])) {
                    falschListe.push(ziel);
                }
            }

            updateInfo(phase === "wiederholung" ? t('wiederholung') : t('haupt'));

        }

        function weiter() {

            if (!geloest) {
                document.getElementById('meldung').textContent = t('erstRichtig');
                return;
            }

            index++;
            neueFrage();

        }

        function spielEnde() {

            document.getElementById('grid').style.display = 'none';
            document.getElementById('weiterBtn').style.display = 'none';
            document.getElementById('frage').textContent = t('fertig');

            let neuerRekord = false;

            if (punkte > rekord) {
                rekord = punkte;
                speichereRekord(rekord);
                neuerRekord = true;
            }

            document.getElementById('balken').style.width = '100%';
            document.getElementById('ende').style.display = 'block';

            document.getElementById('ende').innerHTML =
                '<h2>' + (neuerRekord ? t('neuerRekord') : t('stark') + username + '!') + '</h2>' +
                '<p style="font-size: 24px">' + t('deinePunkte') + ': <b>' + punkte + '</b><br>' + t('fehler') + ': ' + fehler + '<br>' + t('rekord') + ': ' + rekord + '</p>' +
                '<p>' + t('hochgeladen') + '</p><p>' + t('alleGeschafft') + '</p>';

            document.getElementById('info').textContent = t('rekord') + ': ' + rekord + ' ' + t('punkte');

            sendeScore();

        }
